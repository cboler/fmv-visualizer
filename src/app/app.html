<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="app-header">
  <a routerLink="/" class="brand"
    ><img src="icons/mission.svg" width="36" height="36" alt="" /><span
      >FRAME<span class="brand-accent"> / </span>FIELD</span
    ></a
  >
  <div class="header-actions">
    <button
      type="button"
      class="quiet theme-button"
      (click)="toggleTheme()"
      [attr.aria-label]="light() ? 'Use dark theme' : 'Use light theme'"
    >
      {{ light() ? '◐' : '◑' }}
    </button>
    @if (canInstall()) {
      <button type="button" class="quiet" (click)="installApp()">Install app</button>
    }
  </div>
</header>
<main id="main-content"><router-outlet /></main>
<footer class="app-footer">
  <span>FRAME / FIELD <span class="muted">· Full motion. Clear perspective.</span></span
  ><span>Client-side geospatial video explorer</span>
  <a routerLink="/status">Diagnostics</a>
</footer>
